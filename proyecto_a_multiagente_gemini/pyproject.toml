[project]
name = "proyecto_a_multiagente_gemini"
version = "0.1.0"
description = "proyecto_a_multiagente_gemini using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.5a2"
]

[project.scripts]
proyecto_a_multiagente_gemini = "proyecto_a_multiagente_gemini.main:run"
run_crew = "proyecto_a_multiagente_gemini.main:run"
train = "proyecto_a_multiagente_gemini.main:train"
replay = "proyecto_a_multiagente_gemini.main:replay"
test = "proyecto_a_multiagente_gemini.main:test"
run_with_trigger = "proyecto_a_multiagente_gemini.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
